name: EAS Build (iOS & Android)

# Native production build for Budgy.
# IMPORTANT: manual launch only. A push/bump must NEVER create an EAS build.
# Use Actions → EAS Build (iOS & Android) → Run workflow.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: 'Plateforme à builder'
        required: true
        default: 'ios'
        type: choice
        options: [ios, android, all]
      profile:
        description: 'Profil EAS'
        required: true
        default: 'production'
        type: choice
        options: [development, preview, production]
      submit:
        description: 'Auto-submit TestFlight / Play Store après le build (attend la fin)'
        required: true
        default: 'false'
        type: choice
        options: ['true', 'false']

concurrency:
  group: eas-build-${{ github.ref }}-${{ github.event.inputs.platform || 'ios' }}-${{ github.event.inputs.profile || 'production' }}
  cancel-in-progress: false

jobs:
  build:
    name: "EAS Build (${{ github.event.inputs.platform || 'ios' }} / ${{ github.event.inputs.profile || 'production' }})"
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./frontend
        shell: bash

    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: 'true'
      EAS_NO_VCS: '1'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Verify monorepo structure
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f "./package.json" ]; then
            echo "❌ Root package.json detected. Budgy Expo project must remain in frontend/."
            exit 1
          fi

          for f in frontend/package.json frontend/package-lock.json frontend/app.json frontend/eas.json; do
            if [ ! -f "./$f" ]; then
              echo "❌ Required file missing: $f"
              exit 1
            fi
          done
          echo "✅ Monorepo structure OK"

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Expo & EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          expo-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Pre-build quality gate
        run: |
          echo "── TypeScript ──"
          npx tsc --noEmit
          echo "── i18n ──"
          npm run check:i18n
          npm run audit:i18n
          echo "── Premium / IAP / feature contracts ──"
          npm run test:premium
          npm run test:pro-gating
          npm run test:savings-tier
          npm run test:cloud-auth
          npm run test:ai-optimizer
          npm run test:iap-v15
          echo "── Expo config resolution ──"
          npx expo config --type public >/tmp/budgy-expo-config.json
          echo "✅ Pre-build quality gate PASS"

      - name: Print app version info
        run: |
          node -e "const a=require('./app.json').expo; console.log('Name:',a.name); console.log('Version:',a.version); console.log('iOS buildNumber:',a.ios?.buildNumber); console.log('Android versionCode:',a.android?.versionCode); console.log('Bundle ID:',a.ios?.bundleIdentifier); console.log('EAS projectId:',a.extra?.eas?.projectId);"

      - name: EAS CLI sanity
        run: |
          eas --version
          eas whoami

      - name: EAS build
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'ios' }}"
          PROFILE="${{ github.event.inputs.profile || 'production' }}"
          SUBMIT="${{ github.event.inputs.submit || 'false' }}"

          echo "Launching EAS build platform=$PLATFORM profile=$PROFILE submit=$SUBMIT"
          if [ "$SUBMIT" = "true" ]; then
            eas build \
              --platform "$PLATFORM" \
              --profile "$PROFILE" \
              --non-interactive
          else
            eas build \
              --platform "$PLATFORM" \
              --profile "$PROFILE" \
              --non-interactive \
              --no-wait
          fi

      - name: EAS submit (optional)
        if: ${{ github.event.inputs.submit == 'true' }}
        run: |
          PLATFORM="${{ github.event.inputs.platform || 'ios' }}"
          eas submit \
            --platform "$PLATFORM" \
            --latest \
            --non-interactive
