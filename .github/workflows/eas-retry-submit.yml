name: Retry EAS Submit (existing iOS build)

# Recover an interrupted Expo -> App Store Connect upload without creating
# a new IPA or consuming another iOS build number.
on:
  workflow_dispatch:
    inputs:
      submission_id:
        description: "Expo EAS submission ID to retry (not the build ID)"
        required: true
        type: string
        default: "7fe3c265-119c-4188-87f4-4831cdbfbee9"

permissions:
  contents: read

jobs:
  resubmit_only:
    name: Retry existing iOS submission (no build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install EAS CLI
        run: npm install --global eas-cli@latest

      - name: Retry exact failed submission
        working-directory: frontend
        env:
          CI: 'true'
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          SUBMISSION_ID: ${{ inputs.submission_id }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "::error::EXPO_TOKEN secret missing"
            exit 1
          fi
          if [[ ! "$SUBMISSION_ID" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]]; then
            echo "::error::Invalid EAS submission UUID"
            exit 1
          fi
          echo "Retrying exact iOS submission ID: $SUBMISSION_ID"
          echo "This action DOES NOT rebuild Budgy or change version/build number."
          eas submit:retry "$SUBMISSION_ID" --platform ios --non-interactive
