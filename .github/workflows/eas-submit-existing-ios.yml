name: EAS Submit Existing iOS Build to TestFlight

# Manual upload of an ALREADY built and verified IPA.
# No native compilation, no OTA updates, no backend deployment.
# This prevents rebuilding a second binary after the user has tested build 92.
on:
  workflow_dispatch:
    inputs:
      build_id:
        description: "Exact EAS iOS Build ID (UUID from the FINISHED build)"
        required: true
        type: string
      confirmation:
        description: "Type exactly: SUBMIT_TESTFLIGHT_92"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: submit-existing-ios-${{ inputs.build_id }}
  cancel-in-progress: false

jobs:
  submit-existing:
    name: Verify exact build, then upload to TestFlight
    runs-on: ubuntu-latest
    if: ${{ github.ref_name == 'budgy-smart-4.0' && inputs.confirmation == 'SUBMIT_TESTFLIGHT_92' }}
    defaults:
      run:
        working-directory: frontend
        shell: bash
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      CI: 'true'
      BUILD_ID: ${{ inputs.build_id }}
      EAS_NO_VCS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Check release policy and reject unapproved build IDs
        run: |
          node <<'NODE'
          const fs = require('fs');
          const app = require('./app.json').expo;
          const id = process.env.BUILD_ID || '';
          if(!/^[a-f0-9]{8}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{4}-[a-f0-9]{12}$/i.test(id))
            throw Error('Invalid EAS build UUID; do not submit the latest build implicitly.');
          if(app.version !== '4.0.0' || app.ios.buildNumber !== '92' ||
            app.ios.bundleIdentifier !== 'com.budgy.ch.budgy')
            throw Error('Wrong source version: the workflow requires Budgy iOS 4.0.0 (92).');
          if(!process.env.EXPO_TOKEN) throw Error('Missing EXPO_TOKEN repository secret.');
          NODE
      - name: Inspect exact built artifact (read-only)
        run: |
          eas build:view "$BUILD_ID" --json > /tmp/exact-budgy-ios-build.json
          node <<'NODE'
          const fs = require('fs');
          const b = JSON.parse(fs.readFileSync('/tmp/exact-budgy-ios-build.json', 'utf8'));
          const id = process.env.BUILD_ID;
          const field = (...keys) => keys.map(k => b[k]).find(x => x !== undefined && x !== null);
          if(b.id !== id) throw Error('EAS build ID mismatch');
          if(String(b.platform || '').toUpperCase() !== 'IOS') throw Error('Not an iOS build');
          if(String(b.status || '').toUpperCase() !== 'FINISHED') throw Error('Build not FINISHED');
          if(String(field('appVersion') || '') !== '4.0.0') throw Error('Wrong app version');
          if(String(field('appBuildVersion', 'buildNumber') || '') !== '92') throw Error('Wrong app build number');
          const appId = field('applicationIdentifier', 'bundleIdentifier', 'applicationId');
          if (appId && appId !== 'com.budgy.ch.budgy') throw Error('Wrong Apple bundle ID');
          const buildProfile = field('buildProfile');
          if (buildProfile && buildProfile !== 'testflight') throw Error('Expected testflight build profile');
          console.log('Verified exact EAS iOS build: 4.0.0 (92), FINISHED, build ID', id);
          if(!field('gitCommitHash')) console.warn('EAS did not expose source commit; verify build commit/metadata in the EAS dashboard before proceeding.');
          NODE
      - name: Submit EXACT artifact to TestFlight (does not rebuild)
        run: |
          eas submit --platform ios --profile testflight --id "$BUILD_ID" --non-interactive
