name: Pre-build Quality Gate

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/prebuild-check.yml'
      - '.github/workflows/eas-build.yml'
  workflow_dispatch:

concurrency:
  group: prebuild-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Budgy before EAS
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Resolve Expo native config
        run: npx expo config --type public >/tmp/budgy-expo-config.json

      - name: i18n checks
        run: |
          npm run check:i18n
          npm run audit:i18n

      - name: Auth production contract
        run: node scripts/test-auth-production.mjs

      - name: Premium and IAP contracts
        run: |
          npm run test:premium
          npm run test:pro-gating
          npm run test:savings-tier
          npm run test:cloud-auth
          npm run test:ai-optimizer
          npm run test:iap-v15
          npm run test:iap-restore

      - name: Build identity guard
        run: |
          node - <<'NODE'
          const a = require('./app.json').expo;
          const plugins = (a.plugins || []).map((p) => Array.isArray(p) ? p[0] : p);
          if (a.version !== '3.9.0') throw new Error(`Unexpected version ${a.version}`);
          if (a.ios?.buildNumber !== '81') throw new Error(`Unexpected iOS build ${a.ios?.buildNumber}`);
          if (a.android?.versionCode !== 81) throw new Error(`Unexpected Android code ${a.android?.versionCode}`);
          if (a.ios?.bundleIdentifier !== 'com.budgy.ch.budgy') throw new Error('Wrong iOS bundle ID');
          if (!plugins.includes('react-native-iap')) throw new Error('react-native-iap Expo plugin missing');
          console.log('✅ Build identity + react-native-iap plugin verified');
          NODE